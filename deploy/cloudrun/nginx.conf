worker_processes auto;
pid /tmp/umeet-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/umeet-client;
  proxy_temp_path /tmp/umeet-proxy;
  fastcgi_temp_path /tmp/umeet-fastcgi;
  uwsgi_temp_path /tmp/umeet-uwsgi;
  scgi_temp_path /tmp/umeet-scgi;
  server {
    listen 8080;
    server_name _;
    root /app/apps/admin/dist;
    index index.html;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: https:; connect-src 'self' https:; frame-ancestors 'none'" always;
    location /api/ {
      proxy_pass http://127.0.0.1:3100;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }
    location /assets/ { expires 7d; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
