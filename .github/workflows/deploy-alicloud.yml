name: Deploy Umeet to Alibaba ECS
on:
  workflow_run:
    workflows: [Check Umeet]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: umeet-ecs-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.ALICLOUD_DEPLOY_ENABLED == 'true' && github.repository == 'fnb666888/umeet-public' && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.UMEET_ECS_HOST }}
      DEPLOY_USER: ${{ vars.UMEET_ECS_USER }}
      DEPLOY_KEY: ${{ secrets.UMEET_ECS_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.UMEET_ECS_KNOWN_HOSTS }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Configure SSH
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/umeet
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/umeet ~/.ssh/known_hosts
      - name: Upload tracked application source
        run: |
          git archive --format=tar.gz --output="$RUNNER_TEMP/umeet.tar.gz" HEAD:rebuild
          ssh -i ~/.ssh/umeet -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "upload $RELEASE_SHA" < "$RUNNER_TEMP/umeet.tar.gz"
      - name: Build and activate release
        run: |
          ssh -i ~/.ssh/umeet -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "deploy $RELEASE_SHA"
      - name: Clear runner credentials
        if: always()
        run: rm -f ~/.ssh/umeet
